ext {
    loadDotEnv = {
        def envMap = [:]
        def envFile = rootProject.file('.env')
        if (!envFile.exists()) {
            return envMap
        }

        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                return
            }

            int separatorIndex = trimmed.indexOf('=')
            if (separatorIndex <= 0) {
                return
            }

            def key = trimmed.substring(0, separatorIndex).trim()
            def value = trimmed.substring(separatorIndex + 1).trim()
            if ((value.startsWith('"') && value.endsWith('"'))
                    || (value.startsWith("'") && value.endsWith("'"))) {
                value = value.substring(1, value.length() - 1)
            }
            envMap[key] = value
        }
        return envMap
    }

    resolveSecret = { Properties localProperties, String propertyKey, Map dotEnv ->
        def fromLocalProperties = localProperties.getProperty(propertyKey)
        if (fromLocalProperties != null && !fromLocalProperties.trim().isEmpty()) {
            return fromLocalProperties.trim()
        }

        def fromEnvironment = System.getenv(propertyKey)
        if (fromEnvironment != null && !fromEnvironment.trim().isEmpty()) {
            return fromEnvironment.trim()
        }

        def fromDotEnv = dotEnv[propertyKey]
        if (fromDotEnv != null && !fromDotEnv.toString().trim().isEmpty()) {
            return fromDotEnv.toString().trim()
        }

        return ''
    }

    escapeForBuildConfig = { String value ->
        return value.replace('\\', '\\\\').replace('"', '\\"')
    }
}
